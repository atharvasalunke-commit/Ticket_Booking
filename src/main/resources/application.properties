spring.application.name=ticket-booking
server.port=${SERVER_PORT:8080}

# Database settings come from environment variables.
# DB_USERNAME and DB_PASSWORD have no defaults on purpose: the app refuses to start without them.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticket_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates/updates tables from the entities (fine for development).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT settings. JWT_SECRET must be a Base64 string of at least 32 bytes and has no default.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}